<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康軒版國小五年級自然科線上測驗系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4;
        }
        .custom-radio:checked + label {
            border-color: #0d9488;
            background-color: #ccfbf1;
            font-weight: 700;
            color: #0f766e;
        }
        /* 避免印刷或分割問題 */
        .group-card {
            break-inside: avoid;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

    <!-- 頂部導覽頁首 -->
    <header class="bg-gradient-to-r from-teal-600 via-emerald-600 to-cyan-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2.5 rounded-2xl backdrop-blur-md">
                    <svg class="w-8 h-8 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black tracking-wide">康軒版 5上自然線上測驗</h1>
                    <p class="text-xs text-teal-100">國小自然與生活科技 1~2單元題庫（含題组不切題專題）</p>
                </div>
            </div>
            <!-- 模式選擇鍵 -->
            <div id="quiz-modes" class="flex flex-wrap gap-2 justify-center">
                <button onclick="switchQuiz('unit1')" id="btn-unit1" class="mode-btn px-3.5 py-1.5 text-sm rounded-xl font-bold transition-all bg-white text-teal-800 shadow-md">
                    第1單元 動物的世界
                </button>
                <button onclick="switchQuiz('unit2')" id="btn-unit2" class="mode-btn px-3.5 py-1.5 text-sm rounded-xl font-bold transition-all bg-teal-700/60 text-white hover:bg-teal-700">
                    第2單元 聲音與光
                </button>
                <button onclick="switchQuiz('midterm')" id="btn-midterm" class="mode-btn px-3.5 py-1.5 text-sm rounded-xl font-bold transition-all bg-teal-700/60 text-white hover:bg-teal-700">
                    期中大考驗 (全)
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- 單元說明與進度看板 -->
        <div class="bg-white rounded-2xl shadow-sm border border-emerald-100 p-5 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <span id="quiz-tag" class="bg-emerald-100 text-emerald-800 text-xs font-black px-3 py-1 rounded-full">單元選擇</span>
                <h2 id="quiz-title" class="text-xl font-bold text-slate-800 mt-2">載入中...</h2>
                <p id="quiz-desc" class="text-sm text-slate-600 mt-1">請選擇題型並認真作答。</p>
            </div>
            <div class="flex items-center gap-4 bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-200">
                <div class="text-right">
                    <div class="text-xs text-slate-500 font-medium">答題進度</div>
                    <div class="text-lg font-black text-teal-600"><span id="answered-count">0</span> / <span id="total-count">0</span> 題</div>
                </div>
                <div class="w-12 h-12 rounded-full border-4 border-teal-500 border-t-transparent animate-spin hidden" id="loading-spinner"></div>
            </div>
        </div>

        <!-- 試題容器 -->
        <form id="quiz-form" onsubmit="event.preventDefault(); submitQuiz();" class="space-y-8">
            <div id="questions-container" class="space-y-8">
                <!-- 試題卡片會由 JavaScript 動態生成 -->
            </div>

            <!-- 交卷與重測按鈕區 -->
            <div class="sticky bottom-4 bg-white/95 backdrop-blur border border-slate-200 rounded-2xl p-4 shadow-xl flex justify-between items-center gap-4 z-40">
                <button type="button" onclick="resetAnswers()" class="px-5 py-2.5 rounded-xl border-2 border-slate-300 text-slate-600 font-bold hover:bg-slate-100 transition-colors">
                    重新填寫
                </button>
                <button type="submit" id="submit-btn" class="flex-grow sm:flex-grow-0 px-8 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-black text-lg shadow-lg hover:from-emerald-600 hover:to-teal-700 transition-all transform hover:-translate-y-0.5">
                    提交試卷並評分
                </button>
            </div>
        </form>

        <!-- 測驗結果報告 Modal / 卡片 -->
        <div id="result-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border-4 border-teal-500 text-center relative animate-bounce-in">
                <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-emerald-300">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <h3 class="text-2xl font-black text-slate-800 mb-1">測驗完成！</h3>
                <p class="text-sm text-slate-500 mb-4" id="result-quiz-name">康軒版 5上自然科測驗</p>
                
                <!-- 得分展示 -->
                <div class="bg-gradient-to-br from-teal-50 to-emerald-50 p-6 rounded-2xl border border-teal-200 mb-6">
                    <div class="text-xs font-bold text-teal-700 uppercase tracking-widest mb-1">YOUR SCORE</div>
                    <div class="text-5xl font-black text-teal-600"><span id="final-score">0</span> <span class="text-lg font-normal text-slate-500">分</span></div>
                    <div id="score-badge" class="inline-block mt-3 px-4 py-1.5 rounded-full text-sm font-bold bg-teal-600 text-white shadow-sm">
                        特優
                    </div>
                    <p id="score-feedback" class="text-sm text-slate-600 mt-2">觀念非常清晰，繼續保持！</p>
                </div>

                <div class="flex gap-3 justify-center">
                    <button onclick="closeModalAndReview()" class="px-6 py-3 rounded-xl bg-teal-600 text-white font-bold hover:bg-teal-700 transition-all shadow-md w-full">
                        查看試題詳細解析
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-slate-800 text-slate-400 text-xs text-center py-6 border-t border-slate-700 mt-12">
        <p>康軒版國小五年級自然科學上學期 (1~2單元完整題庫與題組解析)</p>
        <p class="mt-1 text-slate-500">線上互動測驗系統版權所有 © 2026</p>
    </footer>

    <!-- JS 邏輯處理與題庫資料 -->
    <script>

                            {

                                <p><strong>【音量與影響對照數據】</strong></p>
                                <ul class="list-disc pl-4 space-y-1">
                                    <li><strong>20 ~ 40 分貝：</strong>樹林風吹聲（非常安靜，不影響睡眠）</li>
                                    <li><strong>30 ~ 60 分貝：</strong>冷氣機運轉聲（40分貝以上會開始干擾睡眠）</li>
                                    <li><strong>40 ~ 65 分貝：</strong>一般對話交流聲（高於65分貝會干擾課堂學習與注意力）</li>
                                    <li><strong>70 ~ 90 分貝：</strong>擴音器叫賣聲、傳統民俗活動（長久暴露使工作效率降低）</li>
                                    <li><strong>80 ~ 110 分貝：</strong>建築工地機具運轉聲（90分貝以上長時間暴露恐造成聽力損失）</li>
                                    <li><strong>110 ~ 140 分貝：</strong>噴射飛機起飛引擎聲（120分貝以上易導致永久性聽力受損）</li>
                                </ul>
                            </div>
                            `
                        },
                        subQuestions: [
                            {
                                id: "g2_1",
                                question: "(1) 小萱夜間睡覺時聽到房間冷氣機運轉聲，此聲音音量最可能是多少分貝？",
                                options: ["20 分貝", "40 分貝", "90 分貝", "140 分貝"],
                                answer: 1,
                                explanation: "冷氣運轉聲約落在 30~60 分貝區間，40分貝為合理範圍。"
                            },
                            {
                                id: "g2_2",
                                question: "(2) 在約 70 分貝的環境音量下進行下列哪一項活動，比較不受該音量干擾影響？",
                                options: ["夜間睡眠", "課堂專心學習", "專心思考與閱讀", "體力勞動與一般工作"],
                                answer: 3,
                                explanation: "70分貝已嚴重影響睡眠與學習，但對於體力勞動或一般工作影響相對較小。"
                            },
                            {
                                id: "g2_3",
                                question: "(3) 在機場跑道協助飛機起降的地勤人員，工作時必須配戴「防音耳罩」，其主要目的是？",
                                options: ["避免與同事聊天", "防範巨大噪音造成永久性聽力受損", "聽音樂舒緩壓力", "增加工作服裝整體造型美感"],
                                answer: 1,
                                explanation: "飛機起飛引擎聲高達 110-140 分貝，戴耳朵保護罩能隔絕極高分貝噪音，防止聽力永久受損。"
                            }
                        ]
                    },
                    // 題組四：自製吸管笛
                    {
                        id: "group_flute",
                        type: "group",
                        tag: "題組四【科學實驗：自製吸管笛與聲音變化】",
                        stimulus: {
                            title: "實驗設定：自製吸管笛樂器結構與操作說明",
                            content: `
                            <div class="bg-sky-50 p-3 rounded-xl border border-sky-200 text-xs text-slate-800 leading-relaxed">
                                <strong>【實驗操作步驟】</strong><br>
                                小華利用剪刀、塑膠吸管、竹籤與濕棉花製作了一管「自製吸管笛」。<br>
                                1. 將濕棉花裹在竹籤一端，塞入吸管內部作為可滑動的活塞。<br>
                                2. 演奏時，將嘴唇對準吸管頂端的笛口吹氣使管內空氣柱振動發聲。<br>
                                3. 吹氣時可以同時用手上下拉動竹籤，藉此改變吸管內部空氣柱的長度。
                            </div>
                            `
                        },
                        subQuestions: [
                            {
                                id: "g4_1",
                                question: "(1) 當手將吸管內部的竹籤「由上往下拉動」時，吸管內空氣柱變長，吹出的聲音音調會？",
                                options: ["聲音音調變高", "聲音音調變低", "聲音音量變大", "沒有任何改變"],
                                answer: 1,
                                explanation: "竹籤往下拉會使內部空氣柱空間變長，振動頻率變慢，因此發出的聲音音調會變低。"
                            },
                            {
                                id: "g4_2",
                                question: "(2) 若小華想要改變這個自製吹奏樂器所發出的「音色」，下列哪一種做法最適當？",
                                options: [
                                    "吹氣時使用更大的吹氣力量",
                                    "將竹籤拉得更長",
                                    "將笛管材質從塑膠吸管更換成竹管或金屬管",
                                    "把吸管頂端剪短"
                                ],
                                answer: 2,
                                explanation: "音色取決於樂器的材質與結構。更換樂器管身材質（如改用竹管或金屬管）可以明顯改變聲音的音色。"
                            }
                        ]
                    }
                ]
            },
            midterm: {
                title: "期中綜合大考驗 (全單元)",
                tag: "綜合大考",
                desc: "整合第1與第2單元所有精選單題與四大題組題，進行全面的觀念測驗。",
                questions: [] // 動態結合 unit1 與 unit2
            }
        };

        // 初始化期中考試題庫
        quizBank.midterm.questions = [...quizBank.unit1.questions, ...quizBank.unit2.questions];

        // 當前狀態
        let currentQuizKey = 'unit1';
        let userAnswers = {};
        let isSubmitted = false;

        // 頁面載入後初始化
        window.onload = function() {
            renderQuiz('unit1');
        };

        // 切換測驗單元
        function switchQuiz(key) {
            currentQuizKey = key;
            
            // 更新 UI 頁籤狀態
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-teal-800', 'shadow-md');
                btn.classList.add('bg-teal-700/60', 'text-white');
            });
            const activeBtn = document.getElementById(`btn-${key}`);
            activeBtn.classList.remove('bg-teal-700/60', 'text-white');
            activeBtn.classList.add('bg-white', 'text-teal-800', 'shadow-md');

            renderQuiz(key);
        }

        // 渲染測驗內容
        function renderQuiz(key) {
            const data = quizBank[key];
            userAnswers = {};
            isSubmitted = false;

            // 標題更新
            document.getElementById('quiz-title').innerText = data.title;
            document.getElementById('quiz-tag').innerText = data.tag;
            document.getElementById('quiz-desc').innerText = data.desc;

            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            let questionIndex = 1;
            let totalSubCount = 0;

            data.questions.forEach((qItem) => {
                if (qItem.type === 'single') {
                    totalSubCount++;
                    const card = createSingleQuestionCard(qItem, questionIndex);
                    container.appendChild(card);
                    questionIndex++;
                } else if (qItem.type === 'group') {
                    // 題組題卡片包覆渲染（重點：不切題！）
                    const groupCard = createGroupQuestionCard(qItem, questionIndex);
                    container.appendChild(groupCard);
                    questionIndex += qItem.subQuestions.length;
                    totalSubCount += qItem.subQuestions.length;
                }
            });

            document.getElementById('total-count').innerText = totalSubCount;
            document.getElementById('answered-count').innerText = '0';
        }

        // 建立單題卡片
        function createSingleQuestionCard(qData, indexNum) {
            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200 transition-all hover:shadow-md";
            card.id = `card-${qData.id}`;

            let optionsHtml = '';
            qData.options.forEach((opt, idx) => {
                optionsHtml += `
                    <div class="relative flex items-center">
                        <input type="radio" id="opt_${qData.id}_${idx}" name="q_${qData.id}" value="${idx}" 
                               onchange="recordAnswer('${qData.id}', ${idx})" class="custom-radio sr-only">
                        <label for="opt_${qData.id}_${idx}" class="w-full p-3.5 px-4 text-sm rounded-xl border border-slate-200 bg-slate-50/50 hover:bg-teal-50/50 cursor-pointer flex items-center gap-3 transition-all">
                            <span class="w-6 h-6 rounded-full border border-slate-300 bg-white flex items-center justify-center font-bold text-xs text-slate-500 shrink-0">${idx + 1}</span>
                            <span class="text-slate-700 font-medium">${opt}</span>
                        </label>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="flex items-center gap-2 mb-3">
                    <span class="bg-teal-100 text-teal-800 text-xs font-black px-2.5 py-1 rounded-md">第 ${indexNum} 題</span>
                    <span class="bg-slate-100 text-slate-600 text-xs font-bold px-2 py-0.5 rounded">${qData.tag}</span>
                </div>
                <h3 class="text-base sm:text-lg font-bold text-slate-800 mb-4 leading-relaxed">${qData.question}</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                    ${optionsHtml}
                </div>
                <div id="explain_${qData.id}" class="hidden mt-4 p-4 rounded-xl bg-amber-50 border-l-4 border-amber-400 text-xs sm:text-sm text-amber-900 leading-relaxed">
                    <strong>💡 詳細解析：</strong> ${qData.explanation}
                </div>
            `;
            return card;
        }

        // 建立題組卡片（確保整體包含短文背景與所有子題於同一個區域中）
        function createGroupQuestionCard(gData, startIndex) {
            const card = document.createElement('div');
            // 題組外層採用明顯的顏色外框，確保題組視覺一體化
            card.className = "group-card bg-white rounded-3xl p-5 sm:p-7 shadow-md border-2 border-teal-300 relative border-l-8 border-l-teal-600 space-y-6";

            // 題組大頭標誌與背景短文/數據表
            let subQuestionsHtml = '';
            let subIdx = startIndex;

            gData.subQuestions.forEach((subQ) => {
                let subOptionsHtml = '';
                subQ.options.forEach((opt, idx) => {
                    subOptionsHtml += `
                        <div class="relative flex items-center">
                            <input type="radio" id="opt_${subQ.id}_${idx}" name="q_${subQ.id}" value="${idx}" 
                                   onchange="recordAnswer('${subQ.id}', ${idx})" class="custom-radio sr-only">
                            <label for="opt_${subQ.id}_${idx}" class="w-full p-3 px-3.5 text-sm rounded-xl border border-slate-200 bg-white hover:bg-teal-50/60 cursor-pointer flex items-center gap-2.5 transition-all">
                                <span class="w-5 h-5 rounded-full border border-slate-300 bg-slate-100 flex items-center justify-center font-bold text-xs text-slate-600 shrink-0">${idx + 1}</span>
                                <span class="text-slate-700 font-medium">${opt}</span>
                            </label>
                        </div>
                    `;
                });

                subQuestionsHtml += `
                    <div class="bg-slate-50/80 p-4 sm:p-5 rounded-2xl border border-slate-200/80" id="card-${subQ.id}">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="bg-teal-600 text-white text-xs font-black px-2.5 py-0.5 rounded-full">子題 ${subIdx}</span>
                        </div>
                        <h4 class="text-sm sm:text-base font-bold text-slate-800 mb-3 leading-relaxed">${subQ.question}</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            ${subOptionsHtml}
                        </div>
                        <div id="explain_${subQ.id}" class="hidden mt-3 p-3.5 rounded-xl bg-amber-50 border-l-4 border-amber-400 text-xs sm:text-sm text-amber-900 leading-relaxed">
                            <strong>💡 詳細解析：</strong> ${subQ.explanation}
                        </div>
                    </div>
                `;
                subIdx++;
            });

            card.innerHTML = `
                <!-- 題組抬頭 -->
                <div class="flex flex-wrap items-center justify-between gap-2 border-b border-teal-100 pb-3">
                    <div class="flex items-center gap-2">
                        <span class="bg-teal-700 text-white font-black text-xs px-3 py-1 rounded-full uppercase tracking-wider flex items-center gap-1">
                            <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                            題組不切題專區
                        </span>
                        <h3 class="text-base sm:text-lg font-black text-teal-900">${gData.tag}</h3>
                    </div>
                    <span class="text-xs text-teal-700 font-bold">子題涵蓋：第 ${startIndex} ~ ${subIdx - 1} 題</span>
                </div>

                <!-- 閱讀情境/資料框 -->
                <div class="bg-gradient-to-br from-teal-50/70 to-emerald-50/70 rounded-2xl p-4 sm:p-5 border border-teal-200">
                    <h4 class="font-bold text-teal-900 text-sm mb-2 flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                        ${gData.stimulus.title}
                    </h4>
                    <div class="text-xs sm:text-sm text-slate-700 leading-relaxed">
                        ${gData.stimulus.content}
                    </div>
                </div>

                <!-- 題組內部子題連續呈現 -->
                <div class="space-y-4 pt-2">
                    ${subQuestionsHtml}
                </div>
            `;

            return card;
        }

        // 記錄答案
        function recordAnswer(qId, selectedIdx) {
            userAnswers[qId] = selectedIdx;
            document.getElementById('answered-count').innerText = Object.keys(userAnswers).length;
        }

        // 清空重填
        function resetAnswers() {
            userAnswers = {};
            isSubmitted = false;
            document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            document.getElementById('answered-count').innerText = '0';
            
            // 隱藏所有解析與顏色回復
            document.querySelectorAll('[id^="explain_"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('label').forEach(lbl => {
                lbl.classList.remove('bg-emerald-100', 'border-emerald-500', 'bg-rose-100', 'border-rose-500', 'text-emerald-900', 'text-rose-900');
            });
        }

        // 提交試卷與評分計算
        function submitQuiz() {
            const data = quizBank[currentQuizKey];
            let totalQuestions = 0;
            let correctCount = 0;

            // 走訪算分與解析顯示
            data.questions.forEach((item) => {
                if (item.type === 'single') {
                    totalQuestions++;
                    const userAns = userAnswers[item.id];
                    const isCorrect = (userAns === item.answer);
                    if (isCorrect) correctCount++;

                    highlightOption(item.id, item.answer, userAns);
                    document.getElementById(`explain_${item.id}`).classList.remove('hidden');

                } else if (item.type === 'group') {
                    item.subQuestions.forEach((subQ) => {
                        totalQuestions++;
                        const userAns = userAnswers[subQ.id];
                        const isCorrect = (userAns === subQ.answer);
                        if (isCorrect) correctCount++;

                        highlightOption(subQ.id, subQ.answer, userAns);
                        document.getElementById(`explain_${subQ.id}`).classList.remove('hidden');
                    });
                }
            });

            const score = Math.round((correctCount / totalQuestions) * 100);
            
            // 展示 Modal 評分結果
            document.getElementById('final-score').innerText = score;
            document.getElementById('result-quiz-name').innerText = data.title;
            
            const badgeEl = document.getElementById('score-badge');
            const feedbackEl = document.getElementById('score-feedback');

            if (score >= 90) {
                badgeEl.innerText = "🌟 自然小博士";
                badgeEl.className = "inline-block mt-3 px-4 py-1.5 rounded-full text-sm font-bold bg-emerald-600 text-white shadow-sm";
                feedbackEl.innerText = "太棒了！你的自然觀念極為清晰，表現完美！";
            } else if (score >= 75) {
                badgeEl.innerText = "🎉 優秀小科學家";
                badgeEl.className = "inline-block mt-3 px-4 py-1.5 rounded-full text-sm font-bold bg-teal-600 text-white shadow-sm";
                feedbackEl.innerText = "表現非常好！稍微複習錯題解析就能邁向滿分喔！";
            } else if (score >= 60) {
                badgeEl.innerText = "👍 繼續加油";
                badgeEl.className = "inline-block mt-3 px-4 py-1.5 rounded-full text-sm font-bold bg-amber-500 text-white shadow-sm";
                feedbackEl.innerText = "已經及格囉！建議閱讀下方試題解析加強較弱的觀念。";
            } else {
                badgeEl.innerText = "📚 需多加複習";
                badgeEl.className = "inline-block mt-3 px-4 py-1.5 rounded-full text-sm font-bold bg-rose-500 text-white shadow-sm";
                feedbackEl.innerText = "沒關係，仔細對照下方的詳細解析，再重新挑戰一次！";
            }

            document.getElementById('result-modal').classList.remove('hidden');
            isSubmitted = true;
        }

        // 標記正確與錯誤選項
        function highlightOption(qId, correctIdx, userAns) {
            const correctLabel = document.querySelector(`label[for="opt_${qId}_${correctIdx}"]`);
            if (correctLabel) {
                correctLabel.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'font-bold');
            }

            if (userAns !== undefined && userAns !== correctIdx) {
                const wrongLabel = document.querySelector(`label[for="opt_${qId}_${userAns}"]`);
                if (wrongLabel) {
                    wrongLabel.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                }
            }
        }

        // 關閉得分彈窗並滑動檢討
        function closeModalAndReview() {
            document.getElementById('result-modal').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
